plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

repositories {
    mavenLocal()
    mavenCentral()
// TODO: descomentar cuando publiquemos a GitHub Packages, y cambiar -SNAPSHOT por la version publicada
//    maven {
//        name = "GitHubPackages"
//        url = uri("https://maven.pkg.github.com/ing-sis-PrintScript/printscript")
//        credentials {
//            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
//            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
//        }
//    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size

    forkEvery = 1
}

dependencies {
    implementation 'printscript:runner:1.0.0-SNAPSHOT'
    implementation 'printscript:common:1.0.0-SNAPSHOT'
    implementation 'printscript:lexer:1.0.0-SNAPSHOT'
    implementation 'printscript:interpreter:1.0.0-SNAPSHOT'
    implementation 'printscript:formatter:1.0.0-SNAPSHOT'
    implementation 'printscript:analyzer:1.0.0-SNAPSHOT'

    testImplementation 'junit:junit:4.13.1'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
