plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/ing-sis-grupo10/printscript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "8m" // initial heap size
    maxHeapSize = "10m" // maximum heap size
}

dependencies {
    implementation 'ar.edu.austral.ingsis.printscript:printscript-common:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-ast:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-lexer:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-parser:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-interpreter:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-formatter:1.1.1'
    implementation 'ar.edu.austral.ingsis.printscript:printscript-analyzer:1.1.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.1'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
