plugins {
    id 'java'
}

repositories {
    // mavenLocal() only mattered while developing/testing this adapter offline against a
    // `./gradlew publishToMavenLocal` build - the real dependency comes from GitHubPackages below.
    // Temporarily commented out to verify resolution against the published GitHub Packages release.
    // mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/IngSis-MAK-LR-DK/PrintScript")
        credentials {
            // A GitHub personal access token with `read:packages` works for both. Set either as
            // env vars, or in ~/.gradle/gradle.properties as gpr.user=... / gpr.key=...
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "8m" // initial heap size
    maxHeapSize = "10m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'

    implementation 'edu.austral.ingsis.printscript:interpreter:1.1.1'
    implementation 'edu.austral.ingsis.printscript:formatter:1.1.1'
    implementation 'edu.austral.ingsis.printscript:analyzer:1.1.1'
    // common/ast/config come along transitively (interpreter/formatter/analyzer depend on them
    // via Gradle's `api`, which maven-publish maps to Maven's "compile" scope). lexer/parser
    // don't - interpreter/formatter/analyzer only ever consume an already-parsed
    // Iterator<Statement>, they don't depend on how it got built - so this adapter, which builds
    // that pipeline itself from raw source text, needs both explicitly.
    implementation 'edu.austral.ingsis.printscript:lexer:1.1.1'
    implementation 'edu.austral.ingsis.printscript:parser:1.1.1'

    // Jackson is only `implementation`-scoped in our own formatter/analyzer modules (an internal
    // detail, not part of their public API), so it isn't visible at compile time here just by
    // depending on them. TckConfig.java uses it directly, so it needs to be declared explicitly.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
