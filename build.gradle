plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Ingsis-BRY/PrintScript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

ext {
    printscript = 'latest.release'
}

configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
    implementation "com.printscript:app:$printscript"
    implementation "com.printscript:language:$printscript"
    implementation "com.printscript:lexer:$printscript"
    implementation "com.printscript:parser:$printscript"
    implementation "com.printscript:pipeline:$printscript"
    implementation "com.printscript:interpreter:$printscript"
    implementation "com.printscript:formatter:$printscript"
    implementation "com.printscript:linter:$printscript"
    implementation "com.printscript:report:$printscript"
    implementation "com.printscript:ast:$printscript"
    implementation "com.printscript:token:$printscript"
    implementation "com.printscript:common:$printscript"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.10'

    testImplementation 'junit:junit:4.13.1'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
