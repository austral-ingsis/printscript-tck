plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/IngsisPrintScript2026/PrintScript")
        credentials {
            username = project.findProperty("gprUser") ?: project.findProperty("gpr.user") ?: System.getenv("USERNAME") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gprToken") ?: project.findProperty("gpr.key") ?: System.getenv("TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "4m" // initial heap size
    maxHeapSize = "6m" // maximum heap size
}

// Newest release of PrintScript in GitHub Packages; pin one with -PprintscriptVersion=<version>
def printscriptVersion = project.findProperty("printscriptVersion") ?: "latest.release"

dependencies {
    implementation "org.example:com.ingsis.engine:${printscriptVersion}"
    implementation "org.example:com.ingsis.common:${printscriptVersion}"
    implementation "org.example:com.ingsis.charstream:${printscriptVersion}"
    implementation "org.example:com.ingsis.lexer:${printscriptVersion}"
    implementation "org.example:com.ingsis.parser:${printscriptVersion}"
    implementation "org.example:com.ingsis.interpreter:${printscriptVersion}"
    implementation "org.example:com.ingsis.formatter:${printscriptVersion}"
    implementation "org.example:com.ingsis.sca:${printscriptVersion}"
    testImplementation 'junit:junit:4.13.1'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
