plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/G16IS/printscript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "15m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'
    implementation("com.g16is.printscript:interpreter:unspecified")
    implementation("com.g16is.printscript:application:unspecified")
    implementation("com.g16is.printscript:common:unspecified")
    implementation("com.g16is.printscript:infrastructure:unspecified")

}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
