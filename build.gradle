plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/IngsisPrintScript2026/PrintScript")
        credentials {
            username = project.findProperty("gprUser") ?: project.findProperty("gpr.user") ?: System.getenv("USERNAME") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gprToken") ?: project.findProperty("gpr.key") ?: System.getenv("TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "4m" // initial heap size
    maxHeapSize = "6m" // maximum heap size
}

dependencies {
    implementation 'org.example:com.ingsis.engine:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.common:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.charstream:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.lexer:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.parser:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.interpreter:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.formatter:1.0-SNAPSHOT'
    implementation 'org.example:com.ingsis.sca:1.0-SNAPSHOT'
    testImplementation 'junit:junit:4.13.1'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
